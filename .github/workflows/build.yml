name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release job attaches the zip to a GitHub Release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Build universal app (release.sh)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ./release.sh "${GITHUB_REF_NAME#v}"; else ./release.sh; fi

      - name: Check the bundle
        run: |
          lipo -info Eureka.app/Contents/MacOS/Eureka
          plutil -lint Eureka.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" Eureka.app/Contents/Info.plist
          # the icon must be a real .icns with the small sizes in it
          iconutil -c iconset Eureka.app/Contents/Resources/AppIcon.icns -o "$RUNNER_TEMP/check.iconset"
          ls "$RUNNER_TEMP/check.iconset"
          test -s "$RUNNER_TEMP/check.iconset/icon_16x16.png"
          test -s "$RUNNER_TEMP/check.iconset/icon_512x512@2x.png"
          codesign --verify --verbose Eureka.app

      - uses: actions/upload-artifact@v4
        with:
          name: Eureka-${{ github.sha }}
          path: Eureka-v*.zip
          if-no-files-found: error

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Eureka-v*.zip --title "Eureka ${GITHUB_REF_NAME#v}" --generate-notes
