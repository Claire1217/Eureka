name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "ERROR: tag $GITHUB_REF_NAME does not match VERSION ($VERSION)" >&2
            exit 1
          }

      - name: Build universal app (release.sh)
        run: ./release.sh

      - name: Check the bundle
        run: |
          lipo -info Eureka.app/Contents/MacOS/Eureka
          plutil -lint Eureka.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" Eureka.app/Contents/Info.plist
          # the icon must be a real .icns with the small sizes in it
          iconutil -c iconset Eureka.app/Contents/Resources/AppIcon.icns -o "$RUNNER_TEMP/check.iconset"
          ls "$RUNNER_TEMP/check.iconset"
          test -s "$RUNNER_TEMP/check.iconset/icon_16x16.png"
          test -s "$RUNNER_TEMP/check.iconset/icon_512x512@2x.png"
          codesign --verify --verbose Eureka.app

      - name: Generate SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ZIP="Eureka-v${VERSION}.zip"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          shasum -a 256 -c "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Eureka-${{ github.sha }}
          path: Eureka-v*.zip*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Eureka-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Eureka ${GITHUB_REF_NAME#v}" \
            --generate-notes
