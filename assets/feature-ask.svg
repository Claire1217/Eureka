    <text x="22" y="28.5" class="t" font-size="11.5" fill="#8c8c92">p95 latency rose to 840 ms after the deploy</text>
    <clipPath id="in2"><rect x="12" y="44" width="416" height="32"/></clipPath>
    <g clip-path="url(#in2)">
      <text x="17" y="66" class="t" font-size="14" fill="#8c5cd9"><tspan font-weight="700">/</tspan><tspan dx="7" textLength="138" lengthAdjust="spacingAndGlyphs">what does p95 mean?</tspan></text>
