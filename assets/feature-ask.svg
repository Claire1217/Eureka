  <rect x="28" y="62" width="190" height="12" rx="6.0" fill="#d4d4dc"/>
  <rect x="28" y="92" width="470" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="108" width="420" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="124" width="450" height="8" rx="4.0" fill="#e9e9ee"/>
  <g transform="translate(24,142)"><rect class="sel" width="332" height="26" rx="5" fill="#6180d9" fill-opacity=".24"
