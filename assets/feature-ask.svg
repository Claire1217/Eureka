    <rect class="sep" x="16" y="88" width="408" height="1" fill="#000" fill-opacity=".07"/>
    <clipPath id="in3"><rect x="12" y="98" width="416" height="74"/></clipPath>
    <g class="sep" clip-path="url(#in3)"><text x="17" y="122" class="t" font-size="13.5" fill="#3d3d44">95% of requests finished within 840 ms; the</text><g class="a0"><rect x="14" y="106" width="424" height="22" fill="#fff"/></g><text x="17" y="143" class="t" font-size="13.5" fill="#3d3d44">slowest 5% took longer. It measures tail latency,</text><g class="a1"><rect x="14" y="127" width="424" height="22" fill="#fff"/></g><text x="17" y="164" class="t" font-size="13.5" fill="#3d3d44">which is what your unluckiest users feel.</text><g class="a2"><rect x="14" y="148" width="424" height="22" fill="#fff"/></g></g>
    <text class="t hintSave" x="428" y="84" font-size="10" fill="#b9b9c0" text-anchor="end">↵ save · esc</text>
    <text class="t hintAsk" x="428" y="84" font-size="10" fill="#8c5cd9" text-anchor="end">↵ ask AI · esc</text>
    <text class="t hintEsc" x="428" y="180" font-size="10" fill="#b9b9c0" text-anchor="end">esc</text>
  </g></g>
  <g transform="translate(300,346)"><g class="hk"><g transform="translate(-58,0)"><rect y="4" width="52" height="48" rx="11" fill="#d9d9e2"/><rect width="52" height="48" rx="11" fill="#fff" stroke="#e3e3ea"/><path d="M15 17h7l9 14h6M28 17h9" fill="none" stroke="#55555c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(6,0)"><rect y="4" width="52" height="48" rx="11" fill="#d9d9e2"/><rect width="52" height="48" rx="11" fill="#fff" stroke="#e3e3ea"/><text x="26" y="31" class="t" font-size="18" font-weight="600" fill="#55555c" text-anchor="middle">T</text></g></g><g class="ret"><g transform="translate(-38,0)"><rect y="4" width="76" height="48" rx="11" fill="#d9d9e2"/><rect width="76" height="48" rx="11" fill="#fff" stroke="#e3e3ea"/><path d="M50 16v10a4 4 0 0 1-4 4H26m0 0 6-6m-6 6 6 6" fill="none" stroke="#55555c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
