  <text x="28" y="160" class="t" font-size="14.5" fill="#2b2b2f" textLength="324" lengthAdjust="spacingAndGlyphs">p95 latency rose to 840 ms after the deploy</text>
  <rect x="28" y="186" width="460" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="202" width="380" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="218" width="430" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="234" width="300" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="262" width="440" height="8" rx="4.0" fill="#e9e9ee"/><rect x="28" y="278" width="210" height="8" rx="4.0" fill="#e9e9ee"/>
</g>
  <g transform="translate(80,204)"><g class="panel" style="transform-box:fill-box;transform-origin:50% 0">
