<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Eureka AI quick answer: select text, press Option+T, type a slash and a question. The answer appears in the panel, using the selected text as context.">
<defs>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Helvetica Neue",Arial,sans-serif}@keyframes cur{0.00%{transform:translate(300px,230px);animation-timing-function:cubic-bezier(.45,0,.25,1)}5.00%{transform:translate(26px,150px);animation-timing-function:cubic-bezier(.45,0,.25,1)}12.00%{transform:translate(352px,156px)}91.00%{transform:translate(352px,156px);animation-timing-function:cubic-bezier(.45,0,.25,1)}100.00%{transform:translate(300px,230px)}}.cur{animation:cur 10.0s linear infinite}@keyframes sel{0.00%{transform:scaleX(0);opacity:1}5.00%{transform:scaleX(0);opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}12.00%{transform:scaleX(1);opacity:1}94.00%{transform:scaleX(1);opacity:1}98.00%{transform:scaleX(1);opacity:0}100.00%{transform:scaleX(0);opacity:0}}.sel{animation:sel 10.0s linear infinite}@keyframes hk{0.00%{opacity:0;transform:translateY(8px)}12.99%{opacity:0;transform:translateY(8px);animation-timing-function:cubic-bezier(.2,.8,.2,1)}15.00%{opacity:1;transform:translateY(0)}16.50%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.2,.8,.2,1)}17.50%{opacity:1;transform:translateY(4px)}19.50%{opacity:1;transform:translateY(0)}22.00%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.45,0,.25,1)}25.00%{opacity:0;transform:translateY(0)}100.00%{opacity:0;transform:translateY(0)}}.hk{animation:hk 10.0s linear infinite}@keyframes ret{0.00%{opacity:0;transform:translateY(8px)}37.99%{opacity:0;transform:translateY(8px);animation-timing-function:cubic-bezier(.2,.8,.2,1)}40.00%{opacity:1;transform:translateY(0)}40.00%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.2,.8,.2,1)}41.00%{opacity:1;transform:translateY(4px)}42.00%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.45,0,.25,1)}43.00%{opacity:1;transform:translateY(0)}45.00%{opacity:0;transform:translateY(0)}100.00%{opacity:0;transform:translateY(0)}}.ret{animation:ret 10.0s linear infinite}@keyframes panel{0.00%{opacity:0;transform:translateY(10px) scale(.96)}18.99%{opacity:0;transform:translateY(10px) scale(.96);animation-timing-function:cubic-bezier(.2,.8,.2,1)}22.00%{opacity:1;transform:translateY(0) scale(1)}94.00%{opacity:1;transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.45,0,.25,1)}96.50%{opacity:0;transform:translateY(-6px) scale(.98)}100.00%{opacity:0;transform:translateY(-6px) scale(.98)}}.panel{animation:panel 10.0s linear infinite}@keyframes ph{0.00%{opacity:0}18.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}22.00%{opacity:1}24.50%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}25.00%{opacity:0}100.00%{opacity:0}}.ph{animation:ph 10.0s linear infinite}@keyframes aiRing{0.00%{opacity:0}24.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}27.50%{opacity:1}45.50%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}47.50%{opacity:0}100.00%{opacity:0}}.aiRing{animation:aiRing 10.0s linear infinite}@keyframes hintSave{0.00%{opacity:0}18.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}22.00%{opacity:1}25.00%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}26.00%{opacity:0}100.00%{opacity:0}}.hintSave{animation:hintSave 10.0s linear infinite}@keyframes hintAsk{0.00%{opacity:0}25.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}28.00%{opacity:1}44.50%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}45.50%{opacity:0}100.00%{opacity:0}}.hintAsk{animation:hintAsk 10.0s linear infinite}@keyframes hintEsc{0.00%{opacity:0}51.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}55.00%{opacity:1}94.00%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}96.00%{opacity:0}100.00%{opacity:0}}.hintEsc{animation:hintEsc 10.0s linear infinite}@keyframes wipe{0.00%{transform:translateX(0)}25.00%{transform:translateX(0)}37.00%{transform:translateX(160px)}97.00%{transform:translateX(160px)}97.10%{transform:translateX(0)}100.00%{transform:translateX(0)}}.wipe{animation:wipe 10.0s linear infinite}@keyframes caretBox{0.00%{opacity:1}44.50%{opacity:1}44.60%{opacity:0}97.00%{opacity:0}97.10%{opacity:1}100.00%{opacity:1}}.caretBox{animation:caretBox 10.0s linear infinite}@keyframes dots{0.00%{opacity:0}46.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}49.00%{opacity:1}50.50%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}52.00%{opacity:0}100.00%{opacity:0}}.dots{animation:dots 10.0s linear infinite}@keyframes grow{0.00%{opacity:0;transform:scaleY(.5)}44.00%{opacity:0;transform:scaleY(.5);animation-timing-function:cubic-bezier(.2,.8,.2,1)}48.00%{opacity:1;transform:scaleY(1)}94.00%{opacity:1;transform:scaleY(1)}96.50%{opacity:0;transform:scaleY(1)}100.00%{opacity:0;transform:scaleY(1)}}.grow{animation:grow 10.0s linear infinite}@keyframes sep{0.00%{opacity:0}51.99%{opacity:0;animation-timing-function:cubic-bezier(.2,.8,.2,1)}55.00%{opacity:1}94.00%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}96.00%{opacity:0}100.00%{opacity:0}}.sep{animation:sep 10.0s linear infinite}@keyframes a0{0.00%{transform:translateX(0)}53.50%{transform:translateX(0)}61.00%{transform:translateX(420px)}97.00%{transform:translateX(420px)}97.10%{transform:translateX(0)}100.00%{transform:translateX(0)}}.a0{animation:a0 10.0s linear infinite}@keyframes a1{0.00%{transform:translateX(0)}61.00%{transform:translateX(0)}68.50%{transform:translateX(420px)}97.00%{transform:translateX(420px)}97.10%{transform:translateX(0)}100.00%{transform:translateX(0)}}.a1{animation:a1 10.0s linear infinite}@keyframes a2{0.00%{transform:translateX(0)}68.50%{transform:translateX(0)}76.00%{transform:translateX(420px)}97.00%{transform:translateX(420px)}97.10%{transform:translateX(0)}100.00%{transform:translateX(0)}}.a2{animation:a2 10.0s linear infinite}.hk,.ret,.panel,.ph,.aiRing,.hintSave,.hintAsk,.hintEsc,.dots,.grow,.sep{opacity:0}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}.caret{animation:blink 1s steps(1) infinite}
  @keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .d1{animation:dot 1.2s infinite}.d2{animation:dot 1.2s .2s infinite}.d3{animation:dot 1.2s .4s infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f1ff"/><stop offset=".55" stop-color="#f4f4ff"/><stop offset="1" stop-color="#fff3f0"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf9f2"/><stop offset="1" stop-color="#e3f3ef"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f3fc"/><stop offset="1" stop-color="#e6ebfa"/></linearGradient>
  <linearGradient id="dotFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc7f2"/><stop offset="1" stop-color="#6180d9"/></linearGradient>
  <filter id="dotShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity=".22"/></filter>
  <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6180d9" stop-opacity=".22"/><stop offset="1" stop-color="#6180d9" stop-opacity="0"/></linearGradient>
  <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5b5b8a" flood-opacity=".16"/></filter>
  <filter id="panelShadow" x="-15%" y="-30%" width="130%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#2b2b55" flood-opacity=".24"/></filter>
  <filter id="aiShadow" x="-15%" y="-30%" width="130%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8c5cd9" flood-opacity=".30"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <clipPath id="frame"><rect width="600" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
